<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>ระบบอยู่ระหว่างปรับปรุง</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:"Segoe UI",Tahoma,sans-serif;color:#102a43;
      background:
        radial-gradient(circle at 18% 18%,rgba(43,139,205,.17),transparent 34%),
        radial-gradient(circle at 82% 82%,rgba(15,42,74,.14),transparent 36%),
        linear-gradient(145deg,#f7fbff,#e7eef6);
    }
    main{
      width:min(620px,100%);padding:44px 34px;text-align:center;background:rgba(255,255,255,.96);
      border:1px solid #d8e2ec;border-radius:22px;box-shadow:0 24px 60px rgba(15,42,74,.16);
    }
    .brand{font-size:14px;font-weight:800;letter-spacing:.15em;color:#1685c4;margin-bottom:30px}
    .icon{
      width:76px;height:76px;margin:0 auto 22px;display:grid;place-items:center;border-radius:22px;
      background:#e4f2fb;color:#126da3;font-size:34px;
    }
    h1{margin:0 0 12px;font-size:clamp(25px,5vw,36px);line-height:1.25}
    p{margin:0;color:#52677c;font-size:17px;line-height:1.75}
    .time{
      display:inline-flex;margin-top:24px;padding:11px 18px;border-radius:999px;
      background:#0f2a4a;color:white;font-size:15px;font-weight:700;
    }
    .note{margin-top:22px;font-size:13px;color:#8292a3}
  </style>
</head>
<body>
  <main>
    <div class="brand">TATA STEEL (THAILAND)</div>
    <div class="icon" aria-hidden="true">🛠</div>
    <h1>ระบบอยู่ระหว่างปรับปรุงชั่วคราว</h1>
    <p>ขณะนี้ทีมงานกำลังปรับปรุงระบบ<br>เพื่อเพิ่มความปลอดภัยและประสิทธิภาพในการใช้งาน</p>
    <div class="time">อัปเดตสถานะอีกครั้ง เวลา 16:00 น.</div>
    <div class="note">ขออภัยในความไม่สะดวก</div>
  </main>
</body>
</html>
